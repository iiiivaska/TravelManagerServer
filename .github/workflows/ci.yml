name: Run tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Swift 6.0
      uses: swift-actions/setup-swift@v1
      with:
        swift-version: '6.0'

    - name: Build and test
      run: |
        swift build
        swift test
